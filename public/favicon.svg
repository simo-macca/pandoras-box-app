<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Pandora's Box Companion</title>
  <!--
    Brand mark: a hand of four Frantic-coloured cards fanning out of an open box.
    Browser favicon variant: rounded tile, slightly larger artwork, no sparkles (legible at 16-32 px).
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2140" />
      <stop offset="1" stop-color="#0c0f17" />
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="300" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55" />
      <stop offset="0.45" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="boxFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f55" />
      <stop offset="1" stop-color="#171a33" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a" />
      <stop offset="0.5" stop-color="#f59e0b" />
      <stop offset="1" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <!-- One playing card, drawn with its pivot (bottom centre) at the origin -->
    <g id="card">
      <rect x="-52" y="-176" width="104" height="152" rx="16" />
      <rect x="-52" y="-176" width="104" height="152" rx="16" fill="url(#sheen)" />
      <rect x="-42" y="-166" width="84" height="132" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="5" />
      <ellipse cx="0" cy="-100" rx="22" ry="34" fill="#ffffff" fill-opacity="0.92" />
    </g>
    <clipPath id="tile"><rect width="512" height="512" rx="116" /></clipPath>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)" />
  <circle cx="256" cy="300" r="190" fill="url(#glow)" clip-path="url(#tile)" />

  <g transform="translate(256 270) scale(1.05) translate(-256 -280)">

  <!-- Fanned hand of cards rising from the box -->
  <g transform="translate(256 336)" filter="url(#shadow)">
    <use href="#card" fill="#3b82f6" transform="rotate(-33)" />
    <use href="#card" fill="#10b981" transform="rotate(-11)" />
    <use href="#card" fill="#facc15" transform="rotate(11)" />
    <use href="#card" fill="#ef4444" transform="rotate(33)" />
  </g>

  <!-- Open box -->
  <g filter="url(#shadow)">
    <path d="M140 318 H372 L356 420 Q354 432 342 432 H170 Q158 432 156 420 Z" fill="url(#boxFront)" />
    <rect x="128" y="300" width="256" height="30" rx="12" fill="url(#gold)" />
    <rect x="128" y="300" width="256" height="10" rx="5" fill="#ffffff" fill-opacity="0.25" />
    <circle cx="256" cy="374" r="18" fill="url(#gold)" />
    <path d="M251 372 a5 5 0 1 1 10 0 l-2 14 h-6 z" fill="#171a33" />
  </g>

  </g>
</svg>
