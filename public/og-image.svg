<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Pandora's Box Companion — social preview</title>
  <!-- Source for og-image.png (1200×630). Re-render the PNG after editing this file. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2140" />
      <stop offset="0.6" stop-color="#11142a" />
      <stop offset="1" stop-color="#0c0f17" />
    </linearGradient>
    <radialGradient id="glow" cx="880" cy="350" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.38" />
      <stop offset="0.5" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a" />
      <stop offset="0.5" stop-color="#f59e0b" />
      <stop offset="1" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fcd34d" />
      <stop offset="1" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="boxFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f55" />
      <stop offset="1" stop-color="#171a33" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05" />
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <g id="card">
      <rect x="-52" y="-176" width="104" height="152" rx="16" />
      <rect x="-52" y="-176" width="104" height="152" rx="16" fill="url(#sheen)" />
      <rect x="-42" y="-166" width="84" height="132" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="5" />
      <ellipse cx="0" cy="-100" rx="22" ry="34" fill="#ffffff" fill-opacity="0.92" />
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#dots)" />
  <circle cx="880" cy="350" r="330" fill="url(#glow)" />

  <!-- Brand stripe in the four Frantic card colours -->
  <g>
    <rect x="0" y="0" width="300" height="6" fill="#ef4444" />
    <rect x="300" y="0" width="300" height="6" fill="#facc15" />
    <rect x="600" y="0" width="300" height="6" fill="#10b981" />
    <rect x="900" y="0" width="300" height="6" fill="#3b82f6" />
  </g>

  <!-- Copy -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect x="80" y="92" width="268" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14" />
    <circle cx="102" cy="110" r="5" fill="#f59e0b" />
    <text x="118" y="115" font-size="14" font-weight="700" letter-spacing="2.2" fill="#e5e7eb">FRANTIC CARD GAME</text>

    <text x="78" y="226" font-size="78" font-weight="800" letter-spacing="-2" fill="#ffffff">Pandora's Box</text>
    <text x="78" y="310" font-size="78" font-weight="800" letter-spacing="-2" fill="url(#goldText)">Companion</text>

    <text x="80" y="372" font-size="24" font-weight="400" fill="#cbd5e1">Score rounds in seconds, follow the leaderboard</text>
    <text x="80" y="406" font-size="24" font-weight="400" fill="#cbd5e1">and look up every card and rule card.</text>

    <!-- Feature chips -->
    <g font-size="16" font-weight="600" fill="#e5e7eb">
      <rect x="80" y="446" width="170" height="42" rx="12" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.12" />
      <rect x="98" y="460" width="10" height="14" rx="3" fill="#ef4444" />
      <text x="120" y="472">Round scoring</text>

      <rect x="262" y="446" width="140" height="42" rx="12" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.12" />
      <rect x="280" y="460" width="10" height="14" rx="3" fill="#facc15" />
      <text x="302" y="472">Rule cards</text>

      <rect x="414" y="446" width="178" height="42" rx="12" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.12" />
      <rect x="432" y="460" width="10" height="14" rx="3" fill="#10b981" />
      <text x="454" y="472">Card dictionary</text>

      <rect x="80" y="500" width="248" height="42" rx="12" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.12" />
      <rect x="98" y="514" width="10" height="14" rx="3" fill="#3b82f6" />
      <text x="120" y="526">Offline · EN · DE · IT · FR</text>
    </g>

    <text x="80" y="590" font-size="14" fill="#94a3b8">Unofficial fan-made companion for Frantic &amp; Pandora's Box by Rulefactory.</text>
  </g>

  <!-- Brand mark -->
  <g transform="translate(880 300) scale(1.05) translate(-256 -280)">
    <g transform="translate(256 336)" filter="url(#shadow)">
      <use href="#card" fill="#3b82f6" transform="rotate(-33)" />
      <use href="#card" fill="#10b981" transform="rotate(-11)" />
      <use href="#card" fill="#facc15" transform="rotate(11)" />
      <use href="#card" fill="#ef4444" transform="rotate(33)" />
    </g>
    <g filter="url(#shadow)">
      <path d="M140 318 H372 L356 420 Q354 432 342 432 H170 Q158 432 156 420 Z" fill="url(#boxFront)" />
      <rect x="128" y="300" width="256" height="30" rx="12" fill="url(#gold)" />
      <rect x="128" y="300" width="256" height="10" rx="5" fill="#ffffff" fill-opacity="0.25" />
      <circle cx="256" cy="374" r="18" fill="url(#gold)" />
      <path d="M251 372 a5 5 0 1 1 10 0 l-2 14 h-6 z" fill="#171a33" />
    </g>
    <g fill="#fde68a">
      <path d="M118 150 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z" />
      <path d="M398 124 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z" fill-opacity="0.8" />
      <path d="M402 236 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" fill-opacity="0.6" />
    </g>
  </g>

  <!-- Mini leaderboard: what the app actually shows -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" filter="url(#shadow)">
    <rect x="930" y="430" width="230" height="150" rx="18" fill="#141831" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.14" />
    <text x="950" y="460" font-size="12" font-weight="700" letter-spacing="1.6" fill="#94a3b8">LEADERBOARD</text>
    <text x="1140" y="460" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="end">R7</text>
    <g font-size="15" font-weight="600" fill="#f1f5f9">
      <circle cx="958" cy="487" r="7" fill="#10b981" />
      <text x="974" y="492">Mia</text>
      <text x="1140" y="492" text-anchor="end" font-weight="700">42</text>
      <rect x="950" y="500" width="190" height="4" rx="2" fill="#ffffff" fill-opacity="0.08" />
      <rect x="950" y="500" width="50" height="4" rx="2" fill="#10b981" />

      <circle cx="958" cy="521" r="7" fill="#3b82f6" />
      <text x="974" y="526">Luca</text>
      <text x="1140" y="526" text-anchor="end" font-weight="700">87</text>
      <rect x="950" y="534" width="190" height="4" rx="2" fill="#ffffff" fill-opacity="0.08" />
      <rect x="950" y="534" width="104" height="4" rx="2" fill="#3b82f6" />

      <circle cx="958" cy="555" r="7" fill="#ef4444" />
      <text x="974" y="560">Noah</text>
      <text x="1140" y="560" text-anchor="end" font-weight="700">131</text>
      <rect x="950" y="568" width="190" height="4" rx="2" fill="#ffffff" fill-opacity="0.08" />
      <rect x="950" y="568" width="157" height="4" rx="2" fill="#ef4444" />
    </g>
  </g>
</svg>
